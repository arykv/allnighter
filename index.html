<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#052E27" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FBF8F0" media="(prefers-color-scheme: light)" />

    <title>All Nighter — everything you need at 11pm the night before</title>
    <meta
      name="description"
      content="CBSE study site for Class 10, 11 and 12. Every NCERT chapter, handwritten notes, percentage and attendance calculators, and honest exam strategy. No login, nothing locked."
    />
    <link rel="canonical" href="https://allnighter.in/" />
    <meta name="author" content="Aryan Rao" />
    <link rel="author" href="https://github.com/arykv" />
    <link rel="icon" href="/school-crest.jpg" />
    <link rel="apple-touch-icon" href="/school-crest.jpg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="All Nighter" />
    <meta property="og:title" content="All Nighter — everything you need at 11pm the night before" />
    <meta
      property="og:description"
      content="Every NCERT chapter for Class 10, 11 and 12, notes, CBSE calculators and honest exam strategy. Free."
    />
    <meta property="og:image" content="https://allnighter.in/school-campus.jpg" />
    <meta property="og:url" content="https://allnighter.in/" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- AdSense. Two things at once: this script is what Google checks to verify
         site ownership, and it is also what serves the ads once the site is
         approved. The meta tag below is a second, independent verification path
         — if an ad blocker stops the script during review, the tag still proves
         ownership. Publisher ID is public by design; it is in every ad request.

         `/ads.txt` carries the matching authorisation record. Google warns about
         and can restrict monetisation on sites without one. -->
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6441824419970565"
      crossorigin="anonymous"
    ></script>
    <meta name="google-adsense-account" content="ca-pub-6441824419970565" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400..700;1,400..600&family=Azeret+Mono:wght@400;500&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,600..800&display=swap"
    />

    <script>
      // Resolve the theme before first paint so the page never flashes the wrong one.
      (function () {
        try {
          var stored = localStorage.getItem('dpsg.theme')
          var dark = stored ? stored === 'dark' : true
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
